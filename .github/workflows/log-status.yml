name: log-status

# GitHub struper cron, så vi kan IKKE stole på tett polling via schedule.
# I stedet: start én kjøring hver 6. time, og la den polle selv hvert 15. min
# internt (poll_loop.py) i ~5t40m. Da dekkes hele døgnet med 15-min-oppløsning.
on:
  schedule:
    # Start ofte (hver 2. time). Hver kjøring varer 5,7 t, og concurrency-køen under
    # holder én kjøring klar, så en ny starter I DET SAMME den forrige slutter
    # -> rygg-mot-rygg, sammenhengende dekning selv om GitHub hopper over noen cron-fyringer.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}         # lar deg starte manuelt fra Actions-fanen

# Ikke start en ny kjøring før den forrige er ferdig (unngår to som skriver samtidig)
concurrency:
  group: gbfs-logger
  cancel-in-progress: false

permissions:
  contents: write               # nødvendig for at jobben skal kunne pushe data tilbake

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # like under GitHubs 6-timers-tak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Poll GBFS in a self-loop
        env:
          PYTHONUNBUFFERED: "1"      # vis print()-linjene live i Actions-loggen
          CLIENT_ID: syver-stave-dtu-bachelor
          OUT_DIR: "data"            # skriv til din eksisterende data-mappe (ikke en ny)
          POLL_MINUTES: "15"
          RUN_MINUTES: "340"
          COMMIT_MINUTES: "60"
        run: python poll_loop.py
